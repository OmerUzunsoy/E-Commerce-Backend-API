  <circle cx="605" cy="300" r="8" fill="#334155"/>
  <circle cx="875" cy="300" r="8" fill="#334155"/>

  <text x="80" y="458" fill="#64748B" font-family="Helvetica, Arial, sans-serif" font-size="18">Request flow: API → Application contracts → Persistence implementations → Domain model</text>
