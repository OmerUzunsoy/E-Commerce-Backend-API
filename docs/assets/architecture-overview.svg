  <text x="918" y="314" fill="#FFEDD5" font-family="Helvetica, Arial, sans-serif" font-size="18">Relationships</text>
  <text x="918" y="344" fill="#FFEDD5" font-family="Helvetica, Arial, sans-serif" font-size="18">Enums</text>
  <text x="918" y="374" fill="#FFEDD5" font-family="Helvetica, Arial, sans-serif" font-size="18">Core Model</text>

  <path d="M318 300H352" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M588 300H622" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
