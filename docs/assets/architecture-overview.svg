  <rect x="892" y="198" width="236" height="204" rx="22" fill="#7C2D12"/>
  <text x="918" y="246" fill="#FFF7ED" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Domain</text>
